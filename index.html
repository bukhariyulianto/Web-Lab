 code:`function tambahBuku(judul, inputStok) {
  if (!judul.trim() || inputStok.trim() === '') return false;
  const stok = Number(inputStok);
  if (!Number.isInteger(stok) || stok < 0) return false;
  buku.push({ judul: judul.trim(), stok });
  render();
  return true;
}
function render() {
  const body = document.querySelector('tbody');
  body.replaceChildren();
  for (const item of buku) {
    const tr = document.createElement('tr');
    for (const nilai of [item.judul, item.stok]) {
      const td = document.createElement('td');
      td.textContent = nilai;
      tr.append(td);
    }
    body.append(tr);
  }
}`,

z-actions"><button class="btn" type="submit">Periksa jawaban\x3c/button>${graded?'<button type="button" class="btn secondary" data-action="retry">Ulangi kuis\x3c/button>':''}\x3c/div>\x3c/form><p style="font-size:10px;color:var(--muted)">Nilai terbaik: ${p.best}/2. Bab selesai jika materi dibaca, lab lulus, dan nilai terbaik kuis 2/2.\x3c/p><div class="lesson-actions"><a class="btn secondary" href="#/bab/${c.id}/latihan">← Kembali ke Lab\x3c/a><a class="btn gold" href="${c.id<6?`#/bab/${c.id+1}/materi`:'#/'}">${c.id<6?'Bab berikutnya':'Lihat progres akhir'} ${icon('arrow')}\x3c/a>\x3c/div>`;}
function references(){return `${breadcrumb('Referensi')}<header class="page-heading"><div class="eyebrow">BELAJAR DARI SUMBERNYA\x3c/div><h1>Konsep yang bisa ditelusuri.\x3c/h1><p>Materi praktik diadaptasi dari TXT yang diberikan. Dokumentasi berikut memverifikasi konsep teknis dan memberi ruang untuk belajar lebih jauh.\x3c/p>\x3c/header><div class="source-box"><div class="eyebrow">SUMBER MATERI UTAMA\x3c/div><p><strong>0CMyC-Dkd5I.txt\x3c/strong> · Transkrip demonstrasi tugas praktik antarmuka SITA. Cakupan sumber: HTML, CSS, JavaScript DOM, login, dashboard, tracking DO, dan stok. Contoh kode portal disusun ulang; data yang dipakai adalah simulasi.\x3c/p><a href="https://www.youtube.com/watch?v=0CMyC-Dkd5I" target="_blank" rel="noopener noreferrer">Lihat video yang tercantum dalam TXT ↗\x3c/a>\x3c/div><p style="font-size:11px;color:var(--muted)">Keempat belas tautan dokumentasi MDN dan OWASP diperiksa kembali pada 23 Oktober 2026. Tautan terbuka pada tab baru dan umumnya berbahasa Inggris. Sumber video diidentifikasi dari TXT; rincian bibliografi yang hanya disebut lisan tidak dijadikan referensi akademik terverifikasi.\x3c/p><div class="refs-grid">${REFERENCES.map(r=>`<a class="reference-card" href="${r.url}" target="_blank" rel="noopener noreferrer"><div class="ref-org"><span>${esc(r.org)}\x3c/span><span>↗\x3c/span>\x3c/div><h2>${esc(r.title)}\x3c/h2><p>${esc(r.note)}\x3c/p><div class="ref-domain">${new URL(r.url).hostname}\x3c/div>\x3c/a>`).join('')}\x3c/div>${foot()}`;}
function guide(){return `${breadcrumb('Panduan')}<header class="page-heading"><div class="eyebrow">CARA MENGGUNAKAN WEBLAB\x3c/div><h1>Sedikit teori. Banyak mencoba.\x3c/h1><p>Portal ini adalah ruang belajar mandiri untuk mahasiswa pemula. Unduh file HTML ini, lalu klik dua kali untuk membukanya di Chrome, Edge, atau Firefox. Tidak perlu instalasi atau koneksi internet untuk materi, latihan, dan kuis.\x3c/p>\x3c/header><section class="guide-block"><h2>Tiga langkah untuk setiap bab\x3c/h2><ol><li><strong>Baca materi.\x3c/strong> Ikuti peta konsep, telusuri kode, lalu klik “Tandai materi dibaca”.\x3c/li><li><strong>Kerjakan Lab kode.\x3c/strong> Ubah baris TODO, jalankan, dan periksa hasil. Semua pemeriksaan harus lulus agar langkah latihan tercatat.\x3c/li><li><strong>Kerjakan kuis.\x3c/strong> Jawab kedua pertanyaan lalu periksa. Baca penjelasan dan coba kembali hingga nilai terbaik 2/2.\x3c/li>\x3c/ol><p>Setiap langkah menyumbang 1 dari 18 langkah total. Bab tuntas setelah tiga langkahnya selesai. Semua bab bisa dibuka; kamu bebas mengulang tanpa kehilangan pencapaian terbaik.\x3c/p>\x3c/section><section class="guide-block"><h2>Progresmu, di perangkatmu\x3c/h2><p>Progres, nilai terbaik, pilihan kuis, dan draf kode disimpan menggunakan <strong>localStorage\x3c/strong> pada browser dan perangkat ini. Reload tidak menghapusnya jika penyimpanan browser tersedia. Mode privat, pembersihan data situs, perpindahan browser, atau pemindahan file dapat menghilangkan progres. Penyimpanan file lokal mengikuti izin browser; gunakan Ekspor progres untuk menyimpan catatan pencapaian. Tidak ada sinkronisasi akun atau panel nilai dosen pada versi ini.\x3c/p><p>Ekspor salinan progres bila ingin menyimpan catatan pencapaian. Fitur impor belum tersedia.\x3c/p><div class="data-tools"><button class="btn secondary" data-action="export">↓ Ekspor progres (.json)\x3c/button><button class="btn ghost danger" data-action="reset-progress">Atur ulang progres\x3c/button>\x3c/div>\x3c/section><section class="guide-block"><h2>Dari lab ke proyek di laptop\x3c/h2><p>Latihan memakai cuplikan HTML mandiri supaya langsung berjalan. Saat membuat proyek utuh, pisahkan file menjadi empat halaman HTML, css/style.css, js/data.js, js/script.js, dan folder img. Muat data sebelum logika aplikasi. Gunakan server pengembangan lokal dari editor untuk memeriksa path, Console, dan Network.\x3c/p><p>Contoh sessionStorage dalam materi dapat dicoba pada proyek lokal biasa. Sandbox lab mengisolasi kode dan tidak memberikan akses ke penyimpanan portal. “Unduh .html” mengambil kode editor saat ini; hasil eksperimen lab kembali ke awal setiap kali dijalankan.\x3c/p>\x3c/section><section class="guide-block"><h2>Tantangan akhir: sambungkan alurnya\x3c/h2><p>Gunakan konsep enam bab untuk membangun ulang antarmuka SITA di editor. Checklist ini adalah panduan latihan mandiri, bukan pemeriksaan otomatis tambahan.\x3c/p><ul class="checklist"><li><span>01\x3c/span> Empat halaman saling terhubung dan judulnya semantik.\x3c/li><li><span>02\x3c/span> CSS bersama nyaman pada desktop dan seluler.\x3c/li><li><span>03\x3c/span> Login demo menolak email atau sandi yang salah.\x3c/li><li><span>04\x3c/span> Dashboard memiliki sapaan, menu, dan ringkasan data.\x3c/li><li><span>05\x3c/span> Tracking menangani dua DO dan nomor yang tidak ada.\x3c/li><li><span>06\x3c/span> Form stok menolak input kosong, negatif, dan pecahan.\x3c/li>\x3c/ul><p>Pengayaan: buat timeline pengiriman dengan createElement dan modal detail buku dengan dialog. Uji melalui keyboard. Catat apa yang hilang setelah reload dan tentukan data yang perlu disimpan.\x3c/p>\x3c/section><section class="guide-block"><h2>Konteks pembelajaran\x3c/h2><p>WebLab adalah materi pendamping independen berdasarkan transkrip yang diberikan, bukan layanan resmi Universitas Terbuka. Data buku, akun, dan pengiriman di lab dibuat untuk latihan. Login JavaScript di sini mempelajari alur interaksi; aplikasi nyata memerlukan autentikasi dan validasi di server.\x3c/p><p>Versi HTML ini dapat dibuka langsung tanpa login. Seluruh materi, lab kode, dan kuis tersedia dalam file ini. Internet hanya diperlukan untuk membuka tautan referensi dan video. Salinan HTML tidak memakai pembatasan akses portal privat Sites.\x3c/p><a class="text-link" href="#/referensi">Telusuri referensi resmi ↗\x3c/a>\x3c/section>${foot()}`;}
function render(keepScroll=false){
 run=null;clearTimeout(runTimeout);
 const parts=location.hash.replace(/^#\/?/,'').split('/');
 if(parts[0]==='bab'&&COURSE.some(c=>c.id===Number(parts[1]))){current={page:'chapter',id:Number(parts[1]),tab:['materi','latihan','kuis'].includes(parts[2])?parts[2]:'materi'};state.last=`#/bab/${current.id}/${current.tab}`;save();}
 else current={page:['referensi','panduan'].includes(parts[0])?parts[0]:'home'};
 const c=COURSE.find(x=>x.id===current.id);
 $('#main').innerHTML=(!persistent?'<div class="storage-warning" role="status">Penyimpanan browser tidak tersedia. Progres hanya bertahan selama halaman ini terbuka; gunakan ekspor sebelum menutup.\x3c/div>':'')+(current.page==='chapter'?chapter(c,current.tab):current.page==='referensi'?references():current.page==='panduan'?guide():home());
 document.title=current.page==='chapter'?`Bab ${c.id}: ${c.title} — WebLab`:current.page==='referensi'?'Referensi — WebLab':current.page==='panduan'?'Panduan — WebLab':'WebLab — Pemrograman Website';
 nav();closeMenu();
 if(current.tab==='latihan')initEditor();
 if(!keepScroll){window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true});}
}
function lineNumbers(){const ed=$('#code-editor');if(!ed)return;$('#line-numbers').textContent=Array.from({length:ed.value.split('\n').length},(_,i)=>i+1).join('\n');$('#line-numbers').scrollTop=ed.scrollTop;}
function initEditor(){const ed=$('#code-editor');lineNumbers();ed.addEventListener('input',()=>{state.chapters[current.id].code=ed.value;save();lineNumbers();});ed.addEventListener('scroll',()=>{$('#line-numbers').scrollTop=ed.scrollTop;});ed.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const start=ed.selectionStart;const end=ed.selectionEnd;ed.setRangeText('  ',start,end,'end');ed.dispatchEvent(new Event('input'));}if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();runCode();}});$('#preview-frame').srcdoc='<html lang="id"><body style="font:13px/1.8 system-ui;color:#6b7a6d;padding:25px"><p style="font-size:25px">↳\x3c/p>Hasil kodenya akan muncul di sini.<br>Ubah editor lalu klik <strong>Jalankan &amp; periksa\x3c/strong>.\x3c/body>\x3c/html>';}
function runCode(){
 const c=COURSE.find(x=>x.id===current.id);const ed=$('#code-editor');if(!c||!ed)return;
 clearTimeout(runTimeout);const runId=String(Date.now())+'-'+Math.random().toString(36).slice(2);run={id:runId,chapter:c.id};state.chapters[c.id].code=ed.value;save();
 $('#run-code').disabled=true;$('#run-code').textContent='Memeriksa…';
 $('#lab-results').innerHTML='<h3>Menjalankan kode…\x3c/h3><p>Memeriksa hasil di lingkungan latihan.\x3c/p>';
 const bootstrap=`\x3cscript>window.__labErrors=[];window.addEventListener('error',e=>window.__labErrors.push(e.message));window.addEventListener('unhandledrejection',e=>window.__labErrors.push(String(e.reason)));<\/script>`;
 const testScript=`\x3cscript>window.addEventListener('load',()=>{setTimeout(()=>{const results=[];const check=(label,ok)=>results.push({label,pass:!!ok});try{${c.lab.tests}}catch(e){results.push({label:'Error: '+e.message,pass:false});}for(const msg of window.__labErrors){results.push({label:'JavaScript: '+msg,pass:false});}parent.postMessage({type:'weblab-result',runId:${JSON.stringify(runId)},results},'*');},80);});<\/script>`;
 const base=`<!doctype html><html lang="id"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:13px/1.7 system-ui;color:#233d32;padding:20px;margin:0}h1{font-size:24px}h2{font-size:18px}label{display:block;margin:12px 0}input{display:block;width:calc(100% - 20px);padding:9px;border:1px solid #c7d1c2;border-radius:5px;margin-top:4px;font:inherit}button{padding:9px 15px;border:0;background:#173c36;color:white;border-radius:5px;cursor:pointer}table{border-collapse:collapse;width:100%;margin-top:20px}td,th{border-bottom:1px solid #dce1d5;padding:9px;text-align:left}progress{width:100%;accent-color:#173c36}code{font-family:monospace}\x3c/style>${bootstrap}\x3c/head><body>`;
 $('#preview-frame').srcdoc=base+ed.value+testScript+'\x3c/body>\x3c/html>';
 runTimeout=setTimeout(()=>{if(run?.id!==runId)return;$('#run-code').disabled=false;$('#run-code').textContent='▶ Jalankan & periksa';$('#lab-results').innerHTML='<h3>Pemeriksaan belum selesai\x3c/h3><p>Periksa tag script yang belum ditutup atau kode yang berhenti sebelum selesai, lalu jalankan kembali.\x3c/p>';run=null;},5000);
}
window.addEventListener('message',e=>{
 if(!run||e.source!==$('#preview-frame')?.contentWindow||e.data?.type!=='weblab-result'||e.data.runId!==run.id||!Array.isArray(e.data.results))return;
 clearTimeout(runTimeout);const results=e.data.results;const pass=results.length>0&&results.every(r=>r.pass===true);const c=COURSE.find(x=>x.id===run.chapter);
 if(pass){state.chapters[c.id].lab=true;save();nav();}
 $('#run-code').disabled=false;$('#run-code').textContent='▶ Jalankan & periksa';
 $('#lab-results').innerHTML=`<h3>${pass?'✓ Semua pemeriksaan lulus':`↳ ${results.filter(r=>r.pass).length}/${results.length} pemeriksaan lulus`}\x3c/h3>${results.map(r=>`<div class="test-result ${r.pass?'pass':'fail'}"><span>${r.pass?'✓':'×'}\x3c/span><span>${esc(r.label)}\x3c/span>\x3c/div>`).join('')}${pass?'<p style="margin-top:9px">Langkah latihan tersimpan. Coba interaksinya pada pratinjau atau lanjutkan ke kuis.\x3c/p>':''}`;
 const help=$('.lab-help');if(pass&&help)help.lastElementChild.textContent='Draf tersimpan di browser ini · ✓ Latihan pernah lulus';run=null;
});
function download(name,text,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function closeMenu(){$('#sidebar').classList.remove('open');$('#scrim').classList.remove('open');$('#menu-toggle').setAttribute('aria-expanded','false');}
$('#menu-toggle').addEventListener('click',()=>{const open=!$('#sidebar').classList.contains('open');$('#sidebar').classList.toggle('open',open);$('#scrim').classList.toggle('open',open);$('#menu-toggle').setAttribute('aria-expanded',String(open));});$('#scrim').addEventListener('click',closeMenu);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
document.addEventListener('click',async e=>{
 if(e.target.closest('.skip')){e.preventDefault();$('#main').focus();$('#main').scrollIntoView({block:'start'});return;}
 const b=e.target.closest('[data-action]');if(!b)return;
 const c=COURSE.find(x=>x.id===current.id);const p=c?state.chapters[c.id]:null;
 switch(b.dataset.action){
 case 'read':p.read=true;save();nav();b.classList.add('secondary');b.textContent='✓ Materi sudah dibaca';$('.step-aside').outerHTML=target(c);toast('Materi ditandai dibaca. Lanjutkan ke Lab kode.');break;
 case 'run':runCode();break;
 case 'reset-code':$('#code-editor').value=c.lab.start;$('#code-editor').dispatchEvent(new Event('input'));toast('Kode awal dipulihkan. Pencapaian terbaik tetap tersimpan.');break;
 case 'solution':$('#code-editor').value=c.lab.solution;$('#code-editor').dispatchEvent(new Event('input'));$('#code-editor').focus();toast('Solusi ada di editor. Jalankan untuk memeriksanya.');break;
 case 'download-code':download(`weblab-bab-${c.id}.html`,'<!doctype html>\n<html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Latihan WebLab\x3c/title><body>\n'+$('#code-editor').value+'\n\x3c/body>\x3c/html>','text/html');break;
 case 'copy':try{await navigator.clipboard.writeText(c.code);toast('Contoh kode disalin.');}catch{toast('Pilih teks pada contoh, lalu salin dengan Ctrl/⌘ + C.');}break;
 case 'retry':p.answers={};p.graded=null;save();render(true);toast('Kuis siap diulang. Nilai terbaik tetap disimpan.');break;
 case 'export':download('weblab-progres.json',JSON.stringify({portal:'WebLab SITA',exportedAt:new Date().toISOString(),summary:summary(),chapters:COURSE.map(x=>({bab:x.id,judul:x.title,materiDibaca:state.chapters[x.id].read,latihanLulus:state.chapters[x.id].lab,nilaiTerbaik:state.chapters[x.id].best,selesai:isDone(x)}))},null,2),'application/json');toast('Catatan progres diunduh.');break;
 case 'reset-progress':$('#dialog-root').innerHTML='<dialog id="reset-dialog" aria-labelledby="reset-title"><h2 id="reset-title">Mulai dari awal?\x3c/h2><p>Semua progres, nilai kuis, dan draf kode pada browser ini akan dihapus. Ekspor progres lebih dahulu jika ingin menyimpan catatan.\x3c/p><div class="data-tools"><button class="btn secondary" data-action="cancel-reset" autofocus>Batal\x3c/button><button class="btn" data-action="confirm-reset">Hapus & mulai ulang\x3c/button>\x3c/div>\x3c/dialog>';$('#reset-dialog').showModal();break;
 case 'cancel-reset':$('#reset-dialog').close();break;
 case 'confirm-reset':for(const x of COURSE)state.chapters[x.id]={read:false,lab:false,best:0,code:x.lab.start,answers:{},graded:null};save();$('#reset-dialog').close();render(true);toast('Progres diatur ulang. Siap untuk mulai lagi.');break;
 }
});
document.addEventListener('change',e=>{if(current.tab!=='kuis'||!e.target.matches('input[type="radio"]'))return;const i=Number(e.target.name.slice(1));state.chapters[current.id].answers[i]=Number(e.target.value);save();document.querySelectorAll(`[name="q${i}"]`).forEach(x=>x.closest('label').classList.toggle('chosen',x.checked));});
document.addEventListener('submit',e=>{if(e.target.id!=='quiz-form')return;e.preventDefault();const c=COURSE.find(x=>x.id===current.id),p=state.chapters[c.id];if(c.quiz.some((q,i)=>![0,1,2,3].includes(Number(p.answers[i]))||p.answers[i]===undefined)){$('#quiz-message').textContent='Jawab kedua pertanyaan sebelum memeriksa.';$('#quiz-message').scrollIntoView({block:'center',behavior:'smooth'});return;}p.graded={...p.answers};const score=c.quiz.filter((q,i)=>Number(p.answers[i])===q.correct).length;p.best=Math.max(p.best,score);save();render(true);$('.quiz-summary').scrollIntoView({block:'center',behavior:'smooth'});});
window.addEventListener('hashchange',()=>render());
render(true);
})();

</script>
</body>
